name: aws/eks
title: Autoheal BYOC - AWS EKS
description: |-
  EKS cluster, one managed node group and the EKS managed add-ons for a
  BYOC-on-EKS Autoheal install.

  Access is through EKS access entries only (authentication mode API); there is
  no aws-auth ConfigMap and no IAM OIDC provider. Workloads get AWS credentials
  through EKS Pod Identity (modules/aws/pod-identity). Kubernetes Secrets are
  envelope-encrypted with the caller's KMS key, all control plane logs go to a
  log group the module creates, and nodes run IMDSv2 only with a hop limit of 1
  on encrypted gp3 volumes.

  The Azure analogue is modules/azure/aks. Naming and tags follow the repo's
  null-label convention (see label.tf and docs/MODULE_STANDARD.md).

usage: |-
  See examples/basic for a runnable configuration wired to the kms and vpc
  modules.

related:
