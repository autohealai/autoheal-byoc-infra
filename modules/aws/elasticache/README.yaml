name: aws/elasticache
title: "Autoheal BYOC: AWS ElastiCache (Valkey)"
description: |-
  ElastiCache replication group for a BYOC-on-EKS Autoheal install, cluster mode
  disabled: one primary plus read replicas with Multi-AZ automatic failover.
  Valkey by default; Redis OSS 6.2 and later is also supported.

  Clients must use TLS and the AUTH token. Data at rest and snapshots are
  encrypted with the caller's KMS key. Slow log and engine log go to CloudWatch
  log groups the module creates. The module also creates its own security group
  (ingress on the cache port only from the allowed security groups and CIDRs),
  the subnet group and a parameter group whose family follows the engine and
  major version (valkey8, redis7).

  The Azure analogue is modules/azure/managed-redis. Naming and tags follow the repo's
  null-label convention (see label.tf and docs/MODULE_STANDARD.md).

usage: |-
  See examples/basic for a runnable configuration.

