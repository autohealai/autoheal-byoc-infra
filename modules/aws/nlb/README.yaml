name: aws/nlb
title: Autoheal BYOC - AWS Network Load Balancer
description: |-
  Network Load Balancer (internal by default) with one TCP listener and one ip
  target group per entry in listeners, e.g. 443 to the Autoheal proxy's 8443.
  The module registers no targets: the AWS Load Balancer Controller registers
  pod IPs through the TargetGroupBinding resources the chart renders from
  target_group_arns. Client IP preservation stays off, so targets see the NLB's
  own address.

  The NLB has its own security group: ingress on each listener port from
  allowed_cidr_blocks and allowed_security_group_ids, egress to the VPC CIDR on
  the target and health check ports. target_security_group_ids (for example the
  EKS cluster security group) get an ingress rule from the NLB security group on
  those ports. Rules are keyed by list position, so IDs created in the same
  apply can be passed in. NLB and target group names are cut to 32 characters
  with a hash suffix. Naming and tags follow the repo's null-label convention
  (see label.tf and docs/MODULE_STANDARD.md).

usage: |-
  See examples/basic for a runnable configuration.

