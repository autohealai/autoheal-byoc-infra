name: aws/rds-cluster
title: Autoheal BYOC — AWS Aurora PostgreSQL (provisioned)
description: |-
  Provisioned Aurora PostgreSQL cluster (writer + optional reader) for a BYOC-on-EKS
  Autoheal install. BYOC policy is provisioned (e.g. db.r7g.large), never Serverless
  v2 or burstable, for a real install. Private: reachable only from the security
  groups in allowed_sg_ids (the EKS node SG) on 5432; storage encrypted.

  The master password is generated and seeded into Secrets Manager by the
  composition (this module takes it as a sensitive input, staying aws-only). The
  Azure analogue is modules/azure/postgres-flexible. Naming and tags follow the
  repo's null-label convention (see label.tf and docs/MODULE_STANDARD.md).

usage: |-
  See examples/basic for a runnable configuration wired to the vpc module.

related:
