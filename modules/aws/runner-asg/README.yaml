name: aws/runner-asg
title: Autoheal BYOC - AWS runner ASG
description: |-
  EC2 Auto Scaling group that runs the runner-go worker as a container
  (Docker-out-of-Docker) in private subnets, polling Temporal's runners
  namespace at temporal_host. It is the AWS port of modules/azure/runner-vmss:
  the same cloud-init files, environment and systemd unit, on Amazon Linux 2023
  with Docker from its package repository. No public address: egress goes
  through the subnets' NAT gateway.

  The composition creates it in the same apply as the cluster: temporal_host and
  tool_response_callback_url point at the internal NLB, and the runner retries
  until Temporal answers. Before each start the systemd unit pulls runner_image
  and retries with a backoff (15 seconds, doubling up to 5 minutes) until the
  pull succeeds. When ecr_registry_host is set, the instances install the ECR
  credential helper so docker pulls with the instance role, and a timer writes
  a login file every hour for runner-go, which pulls the sandbox image through
  the Docker API and does not use credential helpers. Pull access comes from
  additional_iam_policy_arns.

  The launch template requires IMDSv2 with a hop limit of 1, so containers,
  including untrusted sandboxes, cannot reach the instance role. Host names are
  the instance ID, which runner-go uses for its per-host task queue. There is
  no SSH key and no ingress rule: access is through SSM Session Manager. The
  root volume is encrypted gp3. A change to the launch template, such as a new
  runner image or AMI, rolls the instances through an instance refresh. Naming
  and tags follow the repo's null-label convention (see label.tf and
  docs/MODULE_STANDARD.md).

usage: |-
  See examples/basic for a runnable configuration.

