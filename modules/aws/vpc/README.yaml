name: aws/vpc
title: Autoheal BYOC - AWS VPC
description: |-
  VPC for a BYOC-on-EKS Autoheal install, spread over 2 to 6 availability zones
  with one subnet per zone in each tier: public (NAT gateways and internet-facing
  load balancers), private (EKS nodes and pods), and an optional data tier
  (Aurora and ElastiCache, no internet route).

  NAT gateways run one per zone, one in total, or not at all. An S3 gateway
  endpoint and any interface endpoints keep AWS API traffic inside the VPC.
  Flow logs go to a CloudWatch log group the module creates, optionally
  encrypted with a customer managed key. The default security group is
  stripped of all rules.

  The Azure analogue is modules/azure/vnet. Naming and tags follow the repo's
  null-label convention (see label.tf and docs/MODULE_STANDARD.md).

usage: |-
  See examples/basic for a runnable configuration.

