name: azure/blob
title: Autoheal BYOC — Azure Blob storage
description: |-
  Storage account + private container for attachments / knowledge-base objects in
  a BYOC-on-AKS Autoheal install. The app reaches it keyless via the app workload
  identity (Storage Blob Data Contributor, granted in
  modules/azure/workload-identity); no account key is stored anywhere.

  The firewall takes IP ranges (allowed_ip_ranges). Azure Storage ignores IP
  rules for clients in its own region, which come in by a subnet rule instead.
  That rule needs the Microsoft.Storage service endpoint and
  joinViaServiceEndpoint on the client's subnet, so the subnet's owner adds it
  with az storage account network-rule add. The module neither sets nor removes
  subnet rules.

  The AWS analogue is modules/aws/s3. Account names reject dashes and cap at 24
  characters, so the module derives a sanitized name from the label id (override
  available). Naming and tags follow the repo's null-label convention (see
  label.tf and docs/MODULE_STANDARD.md).

usage: |-
  See examples/basic for a runnable configuration.

