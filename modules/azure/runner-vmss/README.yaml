name: azure/runner-vmss
title: Autoheal BYOC - Azure runner VMSS
description: |-
  VMSS that runs the runner-go worker as a container (Docker-out-of-Docker) in the
  runner subnet, polling Temporal's runners namespace at temporal_host. The AWS
  analogue is the EKS EC2/ASG runner. No public IP: egress is via the runner
  subnet's NAT gateway (modules/azure/vnet). The user-assigned identity can be
  granted AcrPull; when acr_name is set, cloud-init also installs the Azure CLI
  and refreshes the ACR login hourly. runner-go pulls the sandbox image through
  the Docker API, which does not use the host's login, so each refresh also
  writes a copy that runner-go reads. With public images none of this runs.

  The composition creates it in the same apply as the cluster: temporal_host is
  the reserved internal address the chart later pins the Temporal load balancer
  to, and the runner retries until Temporal answers. Before each start the
  systemd unit pulls runner_image and retries with a backoff (15 seconds,
  doubling up to 5 minutes) until the pull succeeds, so the image may be pushed
  to a new registry after the apply without reimaging the VMs.
  tool_response_callback_url sets SANDBOX_TOOL_RESPONSE_CALLBACK_URL, where the
  runner posts sandbox tool results (the api-server-go internal listener on port
  8083 of the same reserved address). Naming and tags follow the repo's
  null-label convention (see label.tf and docs/MODULE_STANDARD.md).

usage: |-
  See examples/basic for a runnable configuration.

