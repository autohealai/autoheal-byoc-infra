name: azure/vnet
title: Autoheal BYOC — Azure VNet
description: |-
  Network substrate for a BYOC-on-AKS Autoheal install. Creates a VNet with four
  purpose-built subnets (AKS nodes, PG-delegated, private endpoints, runner VMSS),
  a NAT gateway for runner egress, the PostgreSQL
  Flexible Server private DNS zone, and optional privatelink DNS zones for Blob,
  Key Vault, and AI Foundry / Azure OpenAI. When temporal_ip is set, an NSG on
  the AKS subnet lets only the runner subnet reach that address on ports 7233
  (Temporal) and 8083 (the api-server-go internal listener for tool results).

  With subnet_aks_prefix = "" there is no AKS subnet and no NSG: a VNet for the
  runner, Postgres and private endpoints of a cluster that runs in another VNet,
  such as one in another subscription.

  The AWS analogue is modules/aws/vpc. Naming and tags follow the repo's
  null-label convention (see label.tf and docs/MODULE_STANDARD.md).

usage: |-
  See examples/basic for a runnable configuration.

related:
